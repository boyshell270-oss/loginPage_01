<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Solar Explorer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Montserrat', sans-serif; overflow: hidden; }

    #webgl-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* UI Overlay */
    .header {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10; pointer-events: none; letter-spacing: 4px;
    }
    .header h1 { font-size: 14px; font-weight: 400; color: #8a8d93; text-transform: uppercase; }
    .header span { display: block; font-size: 10px; color: #ff6347; margin-top: 4px; }

    .nav-sidebar {
      position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 14px; z-index: 10;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px; cursor: pointer; opacity: 0.4;
      transition: all 0.3s ease; background: none; border: none; color: white; text-align: left;
    }
    .nav-item:hover, .nav-item.active { opacity: 1; transform: translateX(6px); }
    .radio-circle { width: 14px; height: 14px; border: 1px solid #fff; border-radius: 50%; position: relative; }
    .nav-item.active .radio-circle::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; background: #ff6347; border-radius: 50%;
    }
    .planet-info { display: flex; flex-direction: column; }
    .planet-name { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .planet-dist { font-size: 9px; color: #6c7078; }

    .planet-title-overlay {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      text-align: center; z-index: 10; pointer-events: none; transition: opacity 0.5s;
    }
    .planet-title-overlay h2 { font-size: 12px; letter-spacing: 6px; color: #8a8d93; text-transform: uppercase; }
    .planet-title-overlay h3 { font-size: 48px; letter-spacing: 10px; font-weight: 300; text-transform: uppercase; margin-top: 4px; }
  </style>

  <!-- Three.js Library & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="header">
    <h1>Solar Explorer</h1>
    <span>3D REALISTIC EXPERIENCE</span>
  </div>

  <div class="nav-sidebar" id="sidebar"></div>

  <div class="planet-title-overlay">
    <h2 id="subtitle">PLANET</h2>
    <h3 id="maintitle">EARTH</h3>
  </div>

  <div id="webgl-container"></div>

  <script>
    // Planet Data
    const planetsData = [
      { name: 'Sun', dist: '0 AU', size: 12, color: 0xffaa00, orbit: 0, speed: 0 },
      { name: 'Mercury', dist: '0.39 AU', size: 0.8, color: 0x888888, orbit: 22, speed: 0.04 },
      { name: 'Venus', dist: '0.72 AU', size: 1.5, color: 0xe3bb76, orbit: 32, speed: 0.015 },
      { name: 'Earth', dist: '1 AU', size: 1.6, color: 0x2b82c5, orbit: 45, speed: 0.01 },
      { name: 'Mars', dist: '1.52 AU', size: 1.1, color: 0xc1440e, orbit: 58, speed: 0.008 },
      { name: 'Jupiter', dist: '5.20 AU', size: 5.5, color: 0xb07f35, orbit: 78, speed: 0.002 },
      { name: 'Saturn', dist: '9.53 AU', size: 4.5, color: 0xe0d0b0, orbit: 102, speed: 0.0009, ring: true },
      { name: 'Uranus', dist: '19.18 AU', size: 3.0, color: 0x4b70dd, orbit: 125, speed: 0.0004 },
      { name: 'Neptune', dist: '30.06 AU', size: 2.9, color: 0x274687, orbit: 145, speed: 0.0001 }
    ];

    // Scene Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.002);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 300);
    scene.add(sunLight);

    // Procedural Texture Generator for Realistic Look
    function createNoiseTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, 512, 256);
      
      // Procedural detail overlays
      for (let i = 0; i < 1000; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 256, Math.random() * 50, Math.random() * 4);
      }
      return new THREE.CanvasTexture(canvas);
    }

    // Build Planets & Orbits
    const planetMeshes = [];
    const orbitGroups = [];

    planetsData.forEach((data, index) => {
      const group = new THREE.Group();
      scene.add(group);
      orbitGroups.push(group);

      // Orbit Line
      if (data.orbit > 0) {
        const orbitGeo = new THREE.BufferGeometry();
        const points = [];
        for (let i = 0; i <= 128; i++) {
          const theta = (i / 128) * Math.PI * 2;
          points.push(new THREE.Vector3(Math.cos(theta) * data.orbit, 0, Math.sin(theta) * data.orbit));
        }
        orbitGeo.setFromPoints(points);
        const orbitMat = new THREE.LineDashedMaterial({ color: 0xffffff, opacity: 0.15, transparent: true, dashSize: 1, gapSize: 1 });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        orbitLine.computeLineDistances();
        scene.add(orbitLine);
      }

      // Planet Mesh
      const geometry = new THREE.SphereGeometry(data.size, 64, 64);
      let material;

      if (data.name === 'Sun') {
        material = new THREE.MeshBasicMaterial({ color: data.color });
      } else {
        material = new THREE.MeshStandardMaterial({
          map: createNoiseTexture('#' + data.color.toString(16)),
          roughness: 0.7,
          metalness: 0.1
        });
      }

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.x = data.orbit;
      group.add(mesh);
      planetMeshes.push({ mesh, data, group });

      // Saturn Rings
      if (data.ring) {
        const ringGeo = new THREE.RingGeometry(data.size * 1.4, data.size * 2.3, 64);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xa69575, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }
    });

    // UI Sidebar Setup
    const sidebar = document.getElementById('sidebar');
    planetsData.slice().reverse().forEach((p) => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (p.name === 'Earth' ? ' active' : '');
      btn.innerHTML = `
        <div class="radio-circle"></div>
        <div class="planet-info">
          <span class="planet-name">${p.name}</span>
          <span class="planet-dist">${p.dist}</span>
        </div>
      `;
      btn.onclick = () => focusPlanet(p.name, btn);
      sidebar.appendChild(btn);
    });

    // Camera Focus Logic
    let targetMesh = planetMeshes.find(p => p.data.name === 'Earth');

    function focusPlanet(name, btnElement) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      btnElement.classList.add('active');

      document.getElementById('maintitle').innerText = name;
      targetMesh = planetMeshes.find(p => p.data.name === name);
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Orbit rotations
      planetMeshes.forEach(p => {
        p.group.rotation.y += p.data.speed * 0.5;
        p.mesh.rotation.y += 0.01;
      });

      // Camera Smooth Follow
      if (targetMesh) {
        const worldPos = new THREE.Vector3();
        targetMesh.mesh.getWorldPosition(worldPos);
        
        const offset = targetMesh.data.size * 4 + 5;
        const targetCamPos = new THREE.Vector3(worldPos.x, worldPos.y + offset * 0.4, worldPos.z + offset);

        controls.target.lerp(worldPos, 0.05);
        camera.position.lerp(targetCamPos, 0.05);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
